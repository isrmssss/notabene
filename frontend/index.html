<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>notabene — AI Notebook</title>
    
    <!-- Подключаем современный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Подключаем внешние стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- ГЛАВНАЯ СТРАНИЦА -->
        <div class="main-screen" id="mainScreen">
            <h1 class="logo">notabene</h1>
            <p class="subtitle">Интеллектуальный блокнот</p>
            
            <button class="create-btn" id="createChatBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Создать чат
            </button>

            <!-- Контейнер для скролла чатов -->
            <div class="chats-list" id="chatsList"></div>
        </div>

        <!-- СТРАНИЦА ЧАТА (ПУСТАЯ) -->
        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <button class="back-btn" id="backBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <span class="chat-current-title" id="chatCurrentTitle">Название чата</span>
            </div>
            <div class="chat-body">
                Здесь пока ничего нет...
            </div>
        </div>

    </div>

    <!-- КАСТОМНОЕ МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-window">
            <h3 class="modal-title">Новый блокнот</h3>
            <input type="text" class="modal-input" id="chatNameInput" placeholder="Название чата..." autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn btn-secondary" id="cancelModalBtn">Отмена</button>
                <button class="modal-btn btn-primary" id="confirmModalBtn">Создать</button>
            </div>
        </div>
    </div>

    <!-- Подключаем внешнюю логику -->
    <script src="script.js"></script>
</body>
</html>
