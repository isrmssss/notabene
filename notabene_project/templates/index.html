<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>notabene — AI Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body>

    <div class="app-container">

        <div class="main-screen" id="mainScreen">
            <button class="settings-trigger-btn" id="openSettingsBtn" title="Настройки">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>

            <h1 class="logo">notabene</h1>
            <p class="subtitle">Интеллектуальный dynamic-блокнот</p>

            <button class="create-btn" id="createChatBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Создать чат
            </button>

            <div class="chats-list" id="chatsList">
            </div>
        </div>

        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <button class="back-btn" id="backBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <span class="chat-current-title" id="chatCurrentTitle">Название чата</span>
            </div>
            <div class="chat-body">
                <div id="chatMessages">
                </div>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-window">
            <h3 class="modal-title">Новый блокнот</h3>
            <form hx-post="/htmx/chat" hx-target="#chatsList" hx-swap="beforebegin">
                <input type="text" class="modal-input" name="chat_name" placeholder="Название чата..." autocomplete="off" required>
                <div class="modal-buttons">
                    <button type="button" class="modal-btn btn-secondary" id="cancelModalBtn">Отмена</button>
                    <button type="submit" class="modal-btn btn-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="settingsOverlay">
        <div class="modal-window settings-window">
            <div class="settings-layout">
                <div class="settings-sidebar">
                    <div class="sidebar-item active" data-tab="providers">LLM Провайдеры</div>
                    <div class="sidebar-item disabled" title="Будет добавлено позже">Интерфейс</div>
                </div>

                <div class="settings-content">
                    <div class="tab-content active" id="tab-providers">
                        <h3 class="modal-title">Настройки LLM</h3>
                        <p class="settings-desc">Управляйте подключенными моделями искусственного интеллекта.</p>

                        <div class="providers-list" id="providersList">
                            <div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 10px;">HTMX загрузит провайдеры при открытии настроек</div>
                        </div>

                        <button class="add-provider-trigger" id="addNewProviderBtn" hx-get="/htmx/provider-form" hx-target="#providerFormOverlay" hx-swap="innerHTML">
                            + Добавить провайдера
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-buttons settings-footer">
                <button class="modal-btn btn-secondary" id="closeSettingsBtn">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="providerFormOverlay">
    </div>

    <script src="/static/script.js" defer></script>
</body>
</html>
